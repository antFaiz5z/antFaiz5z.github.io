scheme: Gemini
darkmode: true

menu:
  home: / || fa fa-home
  about: /about/ || fa fa-user
  archives: /archives/ || fa fa-archive
  categories: /categories/ || fa fa-th
  tags: /tags/ || fa fa-tags

menu_settings:
  icons: true
  badges: true

sidebar:
  position: left
  display: always
  padding: 18
  offset: 12

avatar:
  url: /images/avatar.png
  rounded: true
  rotated: false

site_state: true

social:
  GitHub: https://github.com/antFaiz5z || fab fa-github
  RSS: /atom.xml || fa fa-rss

social_icons:
  enable: true
  icons_only: true
  transition: true

links: false

toc:
  enable: true
  number: true
  wrap: false
  expand_all: false
  max_depth: 3

creative_commons:
  license: by-nc-sa
  size: small
  sidebar: false
  post: false

footer:
  powered: true

post_meta:
  item_text: true
  created_at: true
  updated_at: false
  categories: true

post_wordcount:
  item_text_total: true
  item_text_post: true
  wordcount: true
  min2read: true

reading_progress:
  enable: true

back2top:
  enable: true
  sidebar: true
  scrollpercent: true

bookmark:
  enable: true

excerpt_description: true
read_more_btn: true

symbols_count_time:
  separated_meta: true
  item_text_total: false
  item_text_post: false

local_search:
  enable: true
  preload: false

comments:
  style: buttons
  active: utterances
  storage: true
  lazyload: false

utterances:
  enable: true
  repo: antFaiz5z/antFaiz5z.github.io
  issue_term: pathname
  theme: github-dark

codeblock:
  copy_button: true
  fold:
    enable: false

mermaid:
  enable: true
  theme:
    light: default
    dark: dark

favicon:
  small: /images/favicon-16x16-next.png
  medium: /images/favicon-32x32-next.png
  apple_touch_icon: /apple-touch-icon.png
  safari_pinned_tab: /images/avatar.png
